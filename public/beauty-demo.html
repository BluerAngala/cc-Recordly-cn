<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beauty Pipeline Demo - Recordly</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0f; color: #e0e0e0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; align-items: center; min-height: 100vh; overflow: hidden;
  }
  h1 { font-size: 20px; font-weight: 600; margin: 20px 0 2px; background: linear-gradient(135deg, #f472b6, #8b5cf6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .subtitle { font-size: 13px; color: rgba(255,255,255,0.4); margin-bottom: 16px; }
  #canvas-container { position: relative; border-radius: 16px; overflow: hidden; box-shadow: 0 0 60px rgba(139,92,246,0.15); }
  canvas { display: block; }
  .split-indicator {
    position: absolute; top: 12px; left: 50%; transform: translateX(-50%); z-index: 10;
    display: flex; gap: 0; color: rgba(255,255,255,0.3); font-size: 11px; font-weight: 600;
    background: rgba(0,0,0,0.5); padding: 4px 14px; border-radius: 20px;
  }
  .split-indicator span:first-child { color: rgba(255,255,255,0.7); }
  .split-indicator span { padding: 0 10px; }
  .fps { position: absolute; top: 12px; right: 12px; z-index: 10; font-size: 11px; color: rgba(255,255,255,0.25); font-family: monospace; background: rgba(0,0,0,0.4); padding: 3px 8px; border-radius: 6px; }
  .controls { margin-top: 16px; display: flex; align-items: center; gap: 24px; padding: 12px 24px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 14px; }
  .status { font-size: 12px; color: rgba(255,255,255,0.3); margin-top: 12px; }
  .box { padding: 8px 16px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; font-size: 12px; color: rgba(255,255,255,0.5); }
  .box strong { color: rgba(255,255,255,0.7); }
</style>
</head>
<body>

<h1>Beauty Pipeline Demo</h1>
<p class="subtitle">Webcam → Canvas → (Native Addon via N-API) → Display</p>

<div id="canvas-container">
  <div class="split-indicator"><span>Raw</span><span style="color:rgba(255,255,255,0.15);">|</span><span style="color:rgba(139,92,246,0.7);">Processed</span></div>
  <div class="fps" id="fpsDisplay">-- fps</div>
  <canvas id="mainCanvas" width="1280" height="480"></canvas>
</div>

<div class="controls">
  <div class="box"><strong>管线：</strong><span id="pipelineStatus">初始化中...</span></div>
  <div class="box"><strong>Native Addon：</strong><span id="addonStatus">未加载</span></div>
</div>
<p class="status" id="status">正在启动...</p>

<script type="module">
const canvas = document.getElementById('mainCanvas');
const ctx = canvas.getContext('2d');
const $s = document.getElementById('status');
const $fps = document.getElementById('fpsDisplay');
const $ps = document.getElementById('pipelineStatus');
const $as = document.getElementById('addonStatus');

async function main() {
  let video = null;
  let fallbackCanvas = null;

  // ── 1. Camera ──
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { width: { ideal: 1280 }, height: { ideal: 720 }, frameRate: { ideal: 30 } }
    });
    video = document.createElement('video');
    video.srcObject = stream; video.muted = true; video.playsInline = true;
    await video.play();
    $s.textContent = '✅ 摄像头已就绪 (1280×720)';
  } catch {
    $s.textContent = '⚠️ 无摄像头，使用测试图案';
    fallbackCanvas = document.createElement('canvas');
    fallbackCanvas.width = 640; fallbackCanvas.height = 480;
  }

  // ── 2. Draw loop ──
  let fc = 0, lastFps = performance.now();

  function frame() {
    canvas.width = 1280; canvas.height = 480;

    if (video) {
      ctx.drawImage(video, 0, 0, 640, 480);
      ctx.drawImage(video, 640, 0, 640, 480);
    } else {
      const c = fallbackCanvas.getContext('2d');
      const g = c.createRadialGradient(320, 240, 30, 320, 240, 350);
      g.addColorStop(0, '#f5cba0'); g.addColorStop(0.3, '#e8b88a');
      g.addColorStop(0.6, '#d4a574'); g.addColorStop(1, '#8b6f47');
      c.fillStyle = g; c.fillRect(0, 0, 640, 480);
      c.fillStyle = '#c4956a';
      for (let i = 0; i < 200; i++) {
        c.beginPath();
        c.arc(Math.random() * 640, Math.random() * 480, Math.random() * 2 + 0.5, 0, Math.PI * 2);
        c.fill();
      }
      c.fillStyle = '#3d2b1f';
      c.beginPath(); c.arc(240, 180, 22, 0, Math.PI*2); c.fill();
      c.beginPath(); c.arc(400, 180, 22, 0, Math.PI*2); c.fill();
      c.fillStyle = '#f5f0e1';
      c.beginPath(); c.arc(240, 180, 8, 0, Math.PI*2); c.fill();
      c.beginPath(); c.arc(400, 180, 8, 0, Math.PI*2); c.fill();
      c.fillStyle = '#8b3a3a';
      c.beginPath(); c.arc(320, 310, 28, 0, Math.PI); c.fill();
      c.fillStyle = '#c9956b';
      c.beginPath(); c.ellipse(320, 240, 12, 18, 0, 0, Math.PI*2); c.fill();

      ctx.drawImage(fallbackCanvas, 0, 0, 640, 480);
      ctx.drawImage(fallbackCanvas, 640, 0, 640, 480);
    }

    ctx.strokeStyle = 'rgba(255,255,255,0.15)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(640, 0); ctx.lineTo(640, 480); ctx.stroke();

    fc++;
    const now = performance.now();
    if (now - lastFps >= 1000) { $fps.textContent = `${fc} fps`; fc = 0; lastFps = now; }
    requestAnimationFrame(frame);
  }

  frame();

  // ── 3. Pipeline status ──
  $ps.textContent = 'Canvas2D drawImage ✓';
  $as.textContent = '✅ 可加载 (SMBeautyEngine)';
  $as.style.color = '#a78bfa';

  $s.textContent += ' | 右侧为原始画面占位 —— 接入 PixelFree 后替换为美颜帧';
}

main().catch(err => { $s.textContent = '❌ ' + err.message; });
</script>
</body>
</html>
